# Netlify configuration — sitio estático multi-archivo
# (index.html + styles.css + main.js + lib/ + assets/)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # El sitio es estático: no compila nada. Este "build" solo copia los
  # archivos a dist/, que es el directorio de publicación (el panel de
  # Netlify quedó apuntando a "dist"; generándolo funciona igual).
  # Se dejan fuera index_8.html (respaldo de un solo archivo), LEEME.md y
  # .htaccess (solo sirve en Apache/Hostinger).
  command = "rm -rf dist && mkdir dist && cp index.html styles.css main.js 404.html robots.txt dist/ && cp -r assets lib dist/"
  publish = "dist"

# Headers de seguridad para todos los archivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML siempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imágenes, video y fuentes: cache largo (el navegador los reutiliza).
# styles.css y main.js llevan ?v=AAAAMMDD en el HTML para romper caché.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
