# Netlify configuration — sitio estático (index.html + carpeta img/)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Sin build real: el sitio es HTML plano servido desde la raíz del repo.
  # Se define un comando no-op para anular cualquier "npm run build" configurado
  # en el panel de Netlify (netlify.toml tiene prioridad sobre la UI).
  command = "echo 'Sitio estatico: no requiere build'"
  publish = "."

# Headers de seguridad para todos los archivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML siempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imágenes: cache largo (el navegador las reutiliza entre visitas)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
