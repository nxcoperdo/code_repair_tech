# Netlify configuration — sitio estático (index.html + carpeta img/)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # El sitio es estático (index.html + img/). Este "build" no compila nada:
  # solo copia los archivos a dist/, que es el directorio de publicación.
  # Se hace así porque el panel de Netlify quedó apuntando a "dist" de la
  # configuración anterior; generándolo, funciona con cualquier ajuste.
  command = "rm -rf dist && mkdir dist && cp index.html 404.html robots.txt dist/ && cp -r img dist/"
  publish = "dist"

# Headers de seguridad para todos los archivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML siempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imágenes: cache largo (el navegador las reutiliza entre visitas)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
